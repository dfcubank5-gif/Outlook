<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:#fff;
    width:100%;
    max-width:440px;
    padding:44px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo-wrapper{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
}

.ms-logo{
    width:24px;
    height:24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
}

.red{background:#f25022;}
.green{background:#7fba00;}
.blue{background:#00a4ef;}
.yellow{background:#ffb900;}

.logo-text{
    font-size:22px;
    color:#666;
}

h1{
    font-size:24px;
    margin-bottom:25px;
}

input{
    width:100%;
    border:none;
    border-bottom:1px solid #777;
    padding:10px 0;
    outline:none;
    font-size:15px;
}

.links{
    margin-top:16px;
    font-size:14px;
}

.links a{
    text-decoration:none;
    color:#0067b8;
}

.actions{
    margin-top:30px;
    display:flex;
    justify-content:flex-end;
}

button{
    background:#0067b8;
    color:white;
    border:none;
    padding:10px 35px;
    cursor:pointer;
}

button:hover{
    background:#005a9e;
}

.back{
    color:#0067b8;
    cursor:pointer;
    margin-bottom:15px;
    display:inline-block;
}

.hidden{
    display:none;
}

.email-display{
    color:#666;
    margin-bottom:20px;
    font-size:14px;
}

@media(max-width:600px){
    body{
        background:white;
        padding:0;
    }

    .container{
        min-height:100vh;
        max-width:100%;
        box-shadow:none;
        padding:30px 24px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo-wrapper">
        <div class="ms-logo">
            <div class="red"></div>
            <div class="green"></div>
            <div class="blue"></div>
            <div class="yellow"></div>
        </div>
        <div class="logo-text">Microsoft</div>
    </div>

    <form id="login-form">

        <h1>Sign in</h1>

        <input
            type="email"
            id="email"
            name="username"
            placeholder="Email, phone, or Skype"
            required>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            style="margin-top:20px;">

        <div class="links">
            No account? <a href="#">Create one!</a>
        </div>

        <div class="links">
            <a href="#">Can't access your account?</a>
        </div>

        <div class="actions">
            <button type="submit" class="submit-button">
                Sign in
            </button>
        </div>

        <div id="form-message"></div>

    </form>

    <div id="signed-in" hidden>

        <h1>Success</h1>

        <p>
            Signed in as
            <strong id="signed-in-email"></strong>
        </p>

        <div class="actions">
            <button id="logout-button">
                Sign out
            </button>
        </div>

    </div>

</div>

<<script src="config.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
